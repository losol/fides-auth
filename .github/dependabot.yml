version: 2
updates:
  # npm / pnpm workspace — covers all packages/* and config/* via the root lockfile
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      # Commits (and PR titles) look like: "Deps: bump jose from 6.2.3 to 6.3.0"
      prefix: "Deps"
    cooldown:
      # Wait 14 days after a release before opening a PR, so freshly published
      # (and occasionally yanked) versions get a chance to settle.
      default-days: 14
    ignore:
      # @types/node must stay aligned with the minimum supported runtime (Node 22).
      # Bump manually when .nvmrc and engines.node are updated.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Collapse all runtime dependency minor/patch bumps into a single PR.
      # Majors are left out so they still get an individual PR to review.
      production:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      # Collapse all dev-tooling minor/patch bumps into a single PR.
      development:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions — keeps pinned SHAs in workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "Deps"
    cooldown:
      default-days: 14
    groups:
      # One PR for all GitHub Actions bumps.
      github-actions:
        patterns:
          - "*"
