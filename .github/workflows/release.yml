name: Release

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Version or tag
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check for pending changesets
        id: changesets
        run: |
          COUNT=$(find .changeset -name '*.md' ! -name 'README.md' 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "Found $COUNT pending changeset(s)"

      # Pending changesets -> open / update the "Version Packages" PR.
      - name: Create or update version PR
        if: steps.changesets.outputs.count != '0'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm changeset:version
          commit-message: 'chore: version packages'
          pr-title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No pending changesets (e.g. the version PR was just merged) -> tag the
      # released versions. The action pushes the tags and creates GitHub
      # releases; the publish workflows below do the actual npm publish.
      - name: Tag released packages
        if: steps.changesets.outputs.count == '0'
        id: tag
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm changeset:tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GITHUB_TOKEN-pushed tags do not cascade into other workflows, so the
      # publish jobs are dispatched explicitly here.
      - name: Trigger npm publish for released packages
        if: steps.tag.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED: ${{ steps.tag.outputs.published-packages }}
        run: |
          echo "$PUBLISHED" | jq -c '.[]' | while read -r pkg; do
            NAME=$(echo "$pkg" | jq -r '.name')
            TAG="${NAME}@$(echo "$pkg" | jq -r '.version')"

            case "$NAME" in
              @eventuras/fides-auth)
                gh workflow run fides-auth-publish.yml -f "tag=${TAG}" ;;
              @eventuras/fides-auth-next)
                gh workflow run fides-auth-next-publish.yml -f "tag=${TAG}" ;;
              @eventuras/fides-auth-store)
                gh workflow run fides-auth-store-publish.yml -f "tag=${TAG}" ;;
              @eventuras/fides-auth-react)
                gh workflow run fides-auth-react-publish.yml -f "tag=${TAG}" ;;
              *)
                echo "No publish workflow configured for ${NAME}" ;;
            esac
          done
